<div class="settings-page">

  <!-- SETTINGS HEADER -->
  <div class="settings-header">
    <h1>Settings</h1>

    <p>
      Manage your account, preferences, and system settings.
    </p>
  </div>

  <!-- SETTINGS BODY -->
  <div class="settings-body">

    <!-- SETTINGS SIDEBAR -->
    <aside class="settings-sidebar">

      <!-- ACCOUNT -->
      <a
        routerLink="account"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="settings-tab"
      >
        <img
          src="assets/icons/user.svg"
          alt=""
          class="tab-icon"
        />

        <span class="tab-content">
          <span class="tab-title">
            Account
          </span>

          <span class="tab-description">
            Profile Information
          </span>
        </span>
      </a>

      <!-- SECURITY -->
      <a
        routerLink="security"
        routerLinkActive="active"
        class="settings-tab"
      >
        <img
          src="assets/icons/lock.svg"
          alt=""
          class="tab-icon"
        />

        <span class="tab-content">
          <span class="tab-title">
            Security
          </span>

          <span class="tab-description">
            Password and access
          </span>
        </span>
      </a>

      <!-- NOTIFICATIONS -->
      
<a
  class="settings-tab disabled"
  aria-disabled="true"
  (click)="$event.preventDefault()"
>

        <img
          src="assets/icons/notifications.svg"
          alt=""
          class="tab-icon"
        />

        <span class="tab-content">
          <span class="tab-title">
            Notifications
          </span>

          <span class="tab-description">
            Alert preferences
          </span>
        </span>
      </a>

      <!-- SYSTEM -->
      
<a
  class="settings-tab disabled"
  aria-disabled="true"
  (click)="$event.preventDefault()"
>

        <img
          src="assets/icons/system.svg"
          alt=""
          class="tab-icon"
        />

        <span class="tab-content">
          <span class="tab-title">
            System
          </span>

          <span class="tab-description">
            Appearance and defaults
          </span>
        </span>
      </a>

      <!-- DATA PREFERENCES -->
      
<a
  class="settings-tab disabled"
  aria-disabled="true"
  (click)="$event.preventDefault()"
>

        <img
          src="assets/icons/database.svg"
          alt=""
          class="tab-icon"
        />

        <span class="tab-content">
          <span class="tab-title">
            Data Preferences
          </span>

          <span class="tab-description">
            Default filters and data
          </span>
        </span>
      </a>

    </aside>

    <!-- SETTINGS CONTENT -->
    <main class="settings-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
