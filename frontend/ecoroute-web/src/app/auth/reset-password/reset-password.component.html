<div class="reset-page">
  <!-- LEFT SIDE -->
  <section class="reset-left">
    <div class="reset-container">
      <!-- RESET CONTENT -->
      <div class="reset-content">
        <div class="reset-header">
          <h2>Reset Password</h2>

          <p>
            Create a new password for your EcoRoute AI account.
          </p>
        </div>

        <!-- ERROR MESSAGE -->
        <div
          class="form-message error-message"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </div>

        <!-- SUCCESS MESSAGE -->
        <div
          class="form-message success-message"
          *ngIf="successMessage"
        >
          {{ successMessage }}
        </div>

        <form
          class="reset-form"
          (submit)="resetPassword($event)"
        >
          <!-- NEW PASSWORD -->
          <div class="password-group">
            <label for="newPassword">
              New Password
            </label>

            <div class="input-wrapper">
              <img
                class="input-icon"
                src="assets/icons/lock.svg"
                alt=""
              >

              <input
                id="newPassword"
                name="newPassword"
                [(ngModel)]="newPassword"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Enter your new password"
                autocomplete="new-password"
              >

              <button
                type="button"
                class="password-toggle"
                (click)="togglePassword()"
                aria-label="Show or hide password"
              >
                <img
                  [src]="showPassword
                    ? 'assets/icons/eyeclose.svg'
                    : 'assets/icons/eye.svg'"
                  alt=""
                >
              </button>
            </div>

            <!-- PASSWORD REQUIREMENT -->
            <div class="password-info">
              <div class="info-icon">
                i
              </div>

              <p>
                Password must be at least 8 characters and include a mix of letters,
                numbers, and symbols.
              </p>
            </div>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="password-group confirm-password-group">
            <label for="confirmPassword">
              Confirm New Password
            </label>

            <div class="input-wrapper">
              <img
                class="input-icon"
                src="assets/icons/lock.svg"
                alt=""
              >

              <input
                id="confirmPassword"
                name="confirmPassword"
                [(ngModel)]="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
                placeholder="Confirm your new password"
                autocomplete="new-password"
              >

              <button
                type="button"
                class="password-toggle"
                (click)="toggleConfirmPassword()"
                aria-label="Show or hide confirm password"
              >
                <img
                  [src]="showConfirmPassword
                    ? 'assets/icons/eyeclose.svg'
                    : 'assets/icons/eye.svg'"
                  alt=""
                >
              </button>
            </div>
          </div>

          <!-- RESET BUTTON -->
          <button
            type="submit"
            class="reset-button"
            [disabled]="isLoading || !token"
          >
            <span>
              {{ isLoading ? 'Resetting...' : 'Reset Password' }}
            </span>

            <span class="arrow">
              →
            </span>
          </button>
        </form>

        <!-- OR -->
        <div class="or-divider">
          <span></span>
          <p>OR</p>
          <span></span>
        </div>

        <!-- BACK TO LOGIN -->
        <a
          routerLink="/login"
          class="back-button"
        >
          <span class="back-arrow">
            ←
          </span>

          <span>
            Back to Login
          </span>
        </a>
      </div>
    </div>
  </section>

  <!-- RIGHT SIDE -->
  <section class="reset-right">
    <img
      class="hero-image"
      src="assets/images/login-hero.png"
      alt="EcoRoute AI smarter routes cleaner communities"
    >
  </section>
</div>
