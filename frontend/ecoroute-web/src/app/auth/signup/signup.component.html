<div class="signup-page">
  <!-- LEFT SIDE -->
  <section class="signup-left">
    <div class="signup-container">
      <!-- HEADER -->
      <div class="signup-header">
        <h2>Create an account</h2>

        <p>
          Join EcoRoute AI and be a part of a cleaner, greener Cebu.
        </p>
      </div>

      <!-- FORM -->
      <form
        class="signup-form"
        (submit)="signup($event)"
      >
        <!-- FULL NAME -->
        <div class="form-group">
          <label for="fullName">
            Full Name
          </label>

          <div class="input-wrapper">
            <img
              class="input-icon"
              src="/assets/icons/user.svg"
              alt=""
            >

            <input
              id="fullName"
              type="text"
              placeholder="Enter your full name"
              autocomplete="name"
              [(ngModel)]="fullName"
              name="fullName"
            >
          </div>
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">
            Email Address
          </label>

          <div class="input-wrapper">
            <img
              class="input-icon"
              src="/assets/icons/email.svg"
              alt=""
            >

            <input
              id="email"
              type="email"
              placeholder="Enter your email address"
              autocomplete="email"
              [(ngModel)]="email"
              name="email"
            >
          </div>
        </div>

        <!-- USERNAME -->
        <div class="form-group">
          <label for="username">
            Username
          </label>

          <div class="input-wrapper">
            <img
              class="input-icon"
              src="/assets/icons/user.svg"
              alt=""
            >

            <input
              id="username"
              type="text"
              placeholder="Enter your username"
              autocomplete="username"
              [(ngModel)]="username"
              name="username"
            >
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">
            Password
          </label>

          <div class="input-wrapper">
            <img
              class="input-icon"
              src="/assets/icons/lock.svg"
              alt=""
            >

            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              autocomplete="new-password"
              [(ngModel)]="password"
              name="password"
            >

            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              aria-label="Show or hide password"
            >
              <img
                [src]="showPassword ? 'assets/icons/eyeclose.svg' : 'assets/icons/eye.svg'"
                alt=""
              >
            </button>
          </div>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group confirm-password-group">
          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="input-wrapper">
            <img
              class="input-icon"
              src="/assets/icons/lock.svg"
              alt=""
            >

            <input
              id="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Confirm your password"
              autocomplete="new-password"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
            >

            <button
              type="button"
              class="password-toggle"
              (click)="toggleConfirmPassword()"
              aria-label="Show or hide confirm password"
            >
              <img
                [src]="showConfirmPassword ? 'assets/icons/eyeclose.svg' : 'assets/icons/eye.svg'"
                alt=""
              >
            </button>
          </div>
        </div>

        <!-- TERMS -->
        <label class="terms">
          <input
            type="checkbox"
            [(ngModel)]="agreeToTerms"
            name="agreeToTerms"
          >

          <span class="terms-checkbox"></span>

          <span class="terms-text">
            I agree to the
            <a
  href="/terms-of-service"
  (click)="$event.preventDefault(); saveDraftAndNavigate('/terms-of-service')"
>
  Terms of Service
</a>
            and
            <a
  href="/privacy-policy"
  (click)="$event.preventDefault(); saveDraftAndNavigate('/privacy-policy')"
>
  Privacy Policy
</a>
          </span>
        </label>

        <div
          class="signup-error"
          *ngIf="errorMessage"
          role="alert"
        >
          <span class="error-icon">!</span>

          <span>{{ errorMessage }}</span>
        </div>

        <div
          class="signup-success"
          *ngIf="successMessage"
        >
          {{ successMessage }}
        </div>

        <!-- SIGN UP -->
        <button
          type="submit"
          class="signup-button"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
        </button>

        <!-- LOGIN LINK -->
        <div class="login-link">
          Already have an account?

          <a
  href="/login"
  (click)="$event.preventDefault(); leaveSignup()"
>
  Log In
</a>
        </div>
      </form>
    </div>
  </section>

  <!-- RIGHT SIDE -->
  <section class="signup-right">
    <img
      class="hero-image"
      src="/assets/images/login-hero.png"
      alt="EcoRoute AI smarter routes cleaner communities"
    >
  </section>
</div>
